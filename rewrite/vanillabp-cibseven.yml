# How the code of the CIB seven adapter is made from the code of the Camunda 7 adapter.
#
# bin/sync-from-camunda7.sh runs this recipe over a copy of the Camunda 7 adapter. CIB seven
# is Camunda 7 with other names, so a rename does nearly all of the work. Two kinds of names
# change:
#
#   - the names of the engine: the Java packages 'org.camunda.bpm' and 'org.camunda.spin',
#     the package of the model API's extension elements, which CIB seven renamed on its own
#     in 2.0, and the Maven coordinates of the engine jars.
#   - VanillaBP's own names: the Java package, the class names, the adapter type, the
#     artifacts. Without them this adapter could not sit next to the Camunda 7 adapter in one
#     application, and that is how an application moves from Camunda 7 to CIB seven.
#
# CIB seven publishes a recipe of its own, 'org.cibseven.ReplaceCamundaWithCIBSeven'. It is
# not used: it renames every 'org.camunda', so it would also rename the groupId
# 'org.camunda.community.vanillabp' and the FEEL engine 'org.camunda.feel', which CIB seven
# shares with Camunda, and it does not know the package of the extension elements.
#
# What stays as it is: the BPMN namespace 'http://camunda.org/schema/1.0/bpmn' and every
# 'camunda:' attribute, because CIB seven reads only that namespace. The FEEL engine
# 'org.camunda.feel'. 'org.camunda.xstream', a plugin which no CIB seven build exists for.
# The key 'camunda.bpm.enabled' and the path '/camunda' of the web applications, because
# CIB seven kept both.
#
# Every text rule is case sensitive. A rule which is not would turn 'camunda7' into
# 'CibSeven' as well.
#
# The recipes run in the order they are listed. The type renames come first, because they
# name the classes by their old package. The text rules come last, because they also see
# what the Java recipes left behind.
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.cibseven.FromCamunda7
displayName: The CIB seven adapter, made from the Camunda 7 adapter
description: Renames the engine's packages and artifacts, and VanillaBP's Java package, classes, adapter type and names in strings.
recipeList:
  # One entry per class whose name contains 'Camunda7'. Do not edit the lines between the two
  # markers by hand: bin/write-type-renames.sh writes them from the sources.
