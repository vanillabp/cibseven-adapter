---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.cibseven.TheForkDoublesOfTheCamunda7Tests
displayName: The fork in the tests of the Camunda 7 adapter becomes Operaton
description: >-
  Some tests of the Camunda 7 adapter put a stand-in for a CIB seven adapter next to it, to see
  that two engines on the same tables are refused across adapter types. Here the adapter itself
  has the type 'cibseven', so the stand-in would have the same type and the test would check
  something else. So the stand-in becomes one for Operaton, the other fork.
recipeList:
  # Only the type in quotes and in code tags, so the package 'io.vanillabp.cibseven' which
  # ChangePackage just wrote stays. This runs before the rule 'camunda7' -> 'cibseven' below.
  - org.openrewrite.text.FindAndReplace:
      find: '(["''>])cibseven(["''<D])'
      replace: $1operaton$2
      caseSensitive: true
      regex: true
      filePattern: '**/src/test/**/*.java'
  - org.openrewrite.text.FindAndReplace:
      find: CIB seven
      replace: Operaton
      caseSensitive: true
      filePattern: '**/src/test/**/*.java'
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.cibseven.EngineNames
displayName: The names of the engine
description: CIB seven renamed every package of Camunda 7, the package of the model API's extension elements a second time, and every jar.
recipeList:
  # The extension elements of the model API ('CamundaIn', 'CamundaProperties', ...) live in
  # 'instance.cibseven' since CIB seven 2.0. Their class names and getters stay. This rule
  # comes before the general one, which would leave 'instance.camunda' behind.
  - org.openrewrite.text.FindAndReplace:
      find: org.camunda.bpm.model.bpmn.instance.camunda
      replace: org.cibseven.bpm.model.bpmn.instance.cibseven
      caseSensitive: true
  - org.openrewrite.text.FindAndReplace:
      find: org.camunda.bpm.model.bpmn.impl.instance.camunda
      replace: org.cibseven.bpm.model.bpmn.impl.instance.cibseven
      caseSensitive: true
  # The packages, and with them the groupIds 'org.camunda.bpm' and 'org.camunda.bpm.springboot'.
  - org.openrewrite.text.FindAndReplace:
      find: org.camunda.bpm
      replace: org.cibseven.bpm
      caseSensitive: true
  - org.openrewrite.text.FindAndReplace:
      find: org.camunda.spin
      replace: org.cibseven.spin
      caseSensitive: true
  # The same as paths, for instance the schema scripts under 'org/camunda/bpm/engine/db'.
  - org.openrewrite.text.FindAndReplace:
      find: org/camunda/bpm
      replace: org/cibseven/bpm
      caseSensitive: true
  # The jars. Spring 7 is the one of Spring Boot 4, and the web applications come with the
  # starter for Spring Boot 4, whose name ends in '-4'.
  - org.openrewrite.text.FindAndReplace:
      find: camunda-engine-spring-6
      replace: cibseven-engine-spring-7
      caseSensitive: true
  - org.openrewrite.text.FindAndReplace:
      find: '\bcamunda-bpm-spring-boot-starter-webapp\b'
      replace: cibseven-bpm-spring-boot-starter-webapp-4
      caseSensitive: true
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: camunda-engine-plugin-spin
      replace: cibseven-engine-plugin-spin
      caseSensitive: true
  - org.openrewrite.text.FindAndReplace:
      find: camunda-spin-dataformat-json-jackson
      replace: cibseven-spin-dataformat-json-jackson
      caseSensitive: true
  # The engine jar last, so the rules above have taken the longer names already. It also
  # names the jar in messages, for instance 'camunda-engine-<version>.jar'.
  - org.openrewrite.text.FindAndReplace:
      find: '\bcamunda-engine\b'
      replace: cibseven-engine
      caseSensitive: true
      regex: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.cibseven.CibSevenVersion
displayName: One property names the CIB seven version, and the adapter version names its minor
description: >-
  The POMs name the engine version in the property 'cibseven.version'. The adapter's own version
  carries the CIB seven minor, like the Camunda 8 adapter carries the cluster minor, so that a
  second line can come later without a rename.
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: camunda.version
      replace: cibseven.version
      caseSensitive: true
      filePattern: '**/pom.xml'
  # The CIB seven minor this adapter is built and tested with. A new minor is raised here and
  # in the root POM of main together, and so is the minor in the adapter version below.
  - org.openrewrite.text.FindAndReplace:
      find: '<cibseven.version>[^<]*</cibseven.version>'
      replace: '<cibseven.version>2.2.0</cibseven.version>'
      caseSensitive: true
      regex: true
      filePattern: pom.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(<groupId>org\.camunda\.community\.vanillabp</groupId>\s*<artifactId>camunda7-adapter[a-z-]*</artifactId>\s*<version>\d+\.\d+\.\d+)(-SNAPSHOT)?</version>'
      replace: '$1-2.2$2</version>'
      caseSensitive: true
      regex: true
      filePattern: '**/pom.xml'
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.cibseven.Camunda7NamesInText
displayName: VanillaBP's names in strings, comments and resources
description: What no Java recipe sees. Strings, comments, POMs, YAML, properties, JSON, BPMN and DMN files.
recipeList:
  # The repository first, before 'camunda7' below turns it into a name nobody uses.
  - org.openrewrite.text.FindAndReplace:
      find: camunda-community-hub/vanillabp-camunda7-adapter
      replace: vanillabp/cibseven-adapter
      caseSensitive: true
  # The groupId. The Camunda Community Hub owns 'org.camunda.community', and CIB seven is not
  # a Camunda project.
  - org.openrewrite.text.FindAndReplace:
      find: org.camunda.community.vanillabp
      replace: io.vanillabp
      caseSensitive: true
  # Class names in strings and in resources, and the nested classes, which the type renames
  # above do not list. Also the log prefix 'Camunda7[...]' and the bean names
  # 'Camunda7_ProcessEngine_<id>'.
  - org.openrewrite.text.FindAndReplace:
      find: Camunda7
      replace: CibSeven
      caseSensitive: true
  - org.openrewrite.text.FindAndReplace:
      find: CAMUNDA7
      replace: CIBSEVEN
      caseSensitive: true
  # The adapter type, the artifactIds, the engine names 'vanillabp-camunda7-<id>', the
  # Quarkus extension name and its capability 'io.vanillabp.adapter.camunda7'.
  - org.openrewrite.text.FindAndReplace:
      find: camunda7
      replace: cibseven
      caseSensitive: true
  # Javadoc, comments, messages and the names of the Maven modules. A version number stays as
  # it is: 'Camunda 7.24' is a fact about Camunda. So does what is said about the forks of
  # Camunda 7 and its family, and the name of the log a decision is cited from, which the last
  # recipe of this file writes. Without that exception a second run would turn it into
  # 'CIB seven adapter's'.
  - org.openrewrite.text.FindAndReplace:
      find: '(?<!fork of |forks of )Camunda 7(?!\.\d|\d| forks?\b| family\b|\s+(?:\*|//|#)?\s*adapter''s\s+(?:\*|//|#)?\s*(?:\{@code )?DECISIONS)'
      replace: CIB seven
      caseSensitive: true
      regex: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.cibseven.DecisionsOfTheCamunda7Adapter
displayName: The decisions the code cites are those of the Camunda 7 adapter
description: >-
  A citation 'see decision 7 in the repository's DECISIONS.md' in the generated code means
  decision 7 of the Camunda 7 adapter. This repository numbers its own decisions, so the
  citation names the log it points at.
recipeList:
  # The phrase may be wrapped over two lines of a comment, with '*', '//' or '#' in front of
  # the second line. The scripts in bin/ are left out: the self test of the citation check
  # holds such phrases as its own examples.
  - org.openrewrite.text.FindAndReplace:
      find: '([Dd]ecisions?\s+(?:\*|//|#)?\s*\d{1,3}(?:(?:,|,? and| or)\s+(?:\*|//|#)?\s*\d{1,3})*\s+(?:\*|//|#)?\s*in\s+(?:\*|//|#)?\s*the\s+(?:\*|//|#)?\s*)repository''s(?=\s+(?:\*|//|#)?\s*(?:\{@code )?DECISIONS\.md)'
      replace: $1Camunda 7 adapter's
      caseSensitive: true
      regex: true
      filePattern: '**/*.java;**/pom.xml;**/*.yaml;**/*.properties;**/*.json'
  # The same for the shorter form 'decision 7 of DECISIONS.md'.
  - org.openrewrite.text.FindAndReplace:
      find: '([Dd]ecisions?\s+(?:\*|//|#)?\s*\d{1,3}\s+(?:\*|//|#)?\s*of\s+(?:\*|//|#)?\s*)(\{@code )?DECISIONS\.md'
      replace: $1the Camunda 7 adapter's $2DECISIONS.md
      caseSensitive: true
      regex: true
      filePattern: '**/*.java;**/pom.xml;**/*.yaml;**/*.properties;**/*.json'
